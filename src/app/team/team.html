<section class="team" id="team">
  <div class="team-inner">
    <h2 class="team-heading">
      <span class="team-heading-normal">Наша</span>
      <span class="team-heading-accent">Команда</span>
    </h2>

    <div class="team-decorations">
      <img src="assets/images/resized-image.jpeg.webp" alt="" class="team-decor-1" />
      <img src="assets/images/photo.png_009.webp" alt="" class="team-decor-3" />
      <img src="assets/images/photo.png.webp" alt="" class="team-decor-2" />
    </div>

    <div class="team-cards">
      @for (m of members; track m.name; let i = $index) {
        <div class="team-card">
          <div class="team-card-visual">
            <img [src]="m.cardBg" alt="" class="team-card-bg" />
            <img [src]="m.photo" alt="" [class]="'team-card-photo team-card-photo-' + i" />
          </div>
          <div class="team-card-info">
            <div class="team-card-name">{{ m.name }}</div>
            <div class="team-card-role">{{ m.role }}</div>
            <div class="team-card-phone">{{ m.phone }}</div>
            <div class="team-card-tg">{{ m.tg }}</div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
